<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OINP Calculator — Admin</title>

<!-- ============================================================
     SUPABASE CONFIG
============================================================ -->
<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const SUPABASE_URL = "https://obliysgyuizoyxkevqxv.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_PrYD3ZKduEZRfjg9V2Ckgg_8Wz07_sP";

  // ---- SET YOUR OWN ADMIN PASSWORD HERE ----
  const ADMIN_PASSWORD = "a20cqwiFID@";

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let allRows = [];

  window.checkPw = function () {
    const entered = document.getElementById('pw').value;
    const pwErr = document.getElementById('pwErr');
    if (entered === ADMIN_PASSWORD) {
      document.getElementById('login').style.display = 'none';
      document.getElementById('appShell').style.display = 'flex';
      loadData();
    } else {
      pwErr.style.display = 'block';
    }
  };

  window.showTab = function (tab) {
    document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('tab-' + tab).style.display = 'block';
    document.getElementById('nav-' + tab).classList.add('active');
  };

  async function loadData() {
    document.getElementById('loading').style.display = 'block';
    const { data, error } = await supabase
      .from('visitors')
      .select('first_name, email, created_at')
      .order('created_at', { ascending: false });

    if (error) {
      console.error(error);
      document.getElementById('loading').textContent = 'Failed to load data — check your Supabase config and table policies.';
      return;
    }
    allRows = data;
    document.getElementById('loading').style.display = 'none';
    renderOverview();
    renderTable();
  }

  function isSameDay(d1, d2) {
    return d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
  }

  function renderOverview() {
    const now = new Date();
    const oneWeekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
    const oneMonthAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);

    const total = allRows.length;
    const today = allRows.filter(r => r.created_at && isSameDay(new Date(r.created_at), now)).length;
    const thisWeek = allRows.filter(r => r.created_at && new Date(r.created_at) >= oneWeekAgo).length;
    const thisMonth = allRows.filter(r => r.created_at && new Date(r.created_at) >= oneMonthAgo).length;
    const withEmail = allRows.filter(r => r.email).length;
    const emailRate = total ? Math.round((withEmail / total) * 100) : 0;

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statToday').textContent = today;
    document.getElementById('statWeek').textContent = thisWeek;
    document.getElementById('statMonth').textContent = thisMonth;
    document.getElementById('statEmail').textContent = withEmail + ' (' + emailRate + '%)';

    // Recent activity feed — last 8
    const recent = allRows.slice(0, 8);
    document.getElementById('recentFeed').innerHTML = recent.map(r => {
      const dt = r.created_at ? new Date(r.created_at).toLocaleString() : '—';
      return `<div class="feed-item">
                <div class="feed-dot"></div>
                <div>
                  <div class="feed-name">${escapeHtml(r.first_name || 'Unknown')}${r.email ? ' <span class="feed-email">· ' + escapeHtml(r.email) + '</span>' : ''}</div>
                  <div class="feed-time">${dt}</div>
                </div>
              </div>`;
    }).join('') || '<div class="feed-empty">No activity yet.</div>';

    // Simple 7-day bar chart
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(now.getTime() - i * 24 * 60 * 60 * 1000);
      const count = allRows.filter(r => r.created_at && isSameDay(new Date(r.created_at), d)).length;
      days.push({ label: d.toLocaleDateString(undefined, { weekday: 'short' }), count });
    }
    const max = Math.max(1, ...days.map(d => d.count));
    document.getElementById('chart').innerHTML = days.map(d => `
      <div class="chart-col">
        <div class="chart-bar" style="height:${(d.count / max) * 100}%"></div>
        <div class="chart-count">${d.count}</div>
        <div class="chart-label">${d.label}</div>
      </div>`).join('');
  }

  function renderTable() {
    const nameFilter = document.getElementById('fName').value.toLowerCase();
    const emailFilter = document.getElementById('fEmail').value.toLowerCase();
    const filtered = allRows.filter(r =>
      (r.first_name || '').toLowerCase().includes(nameFilter) &&
      (r.email || '').toLowerCase().includes(emailFilter)
    );
    document.getElementById('count').textContent = filtered.length + ' result(s) of ' + allRows.length + ' total';
    document.getElementById('rows').innerHTML = filtered.map(r => {
      const dt = r.created_at ? new Date(r.created_at).toLocaleString() : '—';
      return `<tr><td>${escapeHtml(r.first_name || '')}</td><td>${escapeHtml(r.email || '—')}</td><td>${dt}</td></tr>`;
    }).join('');
    window._filteredRows = filtered;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  window.exportCsv = function () {
    const rows = window._filteredRows || allRows;
    const header = ['First Name', 'Email', 'Date/Time'];
    const lines = [header.join(',')];
    rows.forEach(r => {
      const dt = r.created_at ? new Date(r.created_at).toLocaleString() : '';
      const line = [r.first_name || '', r.email || '', dt].map(v => `"${String(v).replace(/"/g, '""')}"`).join(',');
      lines.push(line);
    });
    const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'oinp-visitors.csv';
    a.click();
    URL.revokeObjectURL(url);
  };

  window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('fName').addEventListener('input', renderTable);
    document.getElementById('fEmail').addEventListener('input', renderTable);
    document.getElementById('exportBtn').addEventListener('click', window.exportCsv);
    document.getElementById('refreshBtn').addEventListener('click', loadData);
    document.getElementById('pw').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') window.checkPw();
    });
  });
</script>
<!-- ============================================================ -->

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

  :root{
    --navy:#101c33;
    --navy-deep:#0a1322;
    --paper:#f6f3ec;
    --red:#c8102e;
    --red-deep:#93081f;
    --gold:#c9a24b;
    --line:rgba(16,28,51,0.14);
    --ink:#101c33;
    --muted:#5b6273;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Login ---------- */
  #login{
    max-width:340px;
    margin:100px auto;
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:30px 28px;
    box-shadow:0 12px 30px -14px rgba(16,28,51,0.25);
  }
  #login h2{font-family:'Fraunces', serif;margin:0 0 16px;font-size:20px;}
  #login input{
    width:100%;padding:11px 12px;margin-bottom:10px;
    border:1.5px solid var(--line);border-radius:8px;box-sizing:border-box;
    font-family:'Inter',sans-serif;font-size:14px;
  }
  #login input:focus{outline:none;border-color:var(--red);}
  #login button{
    width:100%;padding:12px;background:var(--red);color:#fff;border:none;
    border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;
  }
  #login button:hover{background:var(--red-deep);}
  #pwErr{color:var(--red);font-size:12px;display:none;margin:-4px 0 10px;}

  /* ---------- App shell ---------- */
  #appShell{display:none;min-height:100vh;}

  nav{
    width:200px;flex-shrink:0;
    background:var(--navy);
    color:var(--paper);
    padding:26px 14px;
  }
  nav .brand{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:17px;
    margin:0 8px 26px;
    line-height:1.25;
  }
  .nav-item{
    display:block;
    padding:11px 12px;
    border-radius:8px;
    font-size:14px;
    font-weight:500;
    color:rgba(246,243,236,0.75);
    cursor:pointer;
    margin-bottom:4px;
    transition:background 0.15s, color 0.15s;
  }
  .nav-item:hover{background:rgba(246,243,236,0.08);color:#fff;}
  .nav-item.active{background:var(--red);color:#fff;}

  main{flex:1;padding:36px 32px;max-width:1000px;}

  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:26px;
    margin:0 0 22px;
  }

  /* ---------- Stat cards ---------- */
  .stat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:14px;
    margin-bottom:28px;
  }
  .stat-card{
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;
  }
  .stat-card .num{
    font-family:'Fraunces', serif;font-size:30px;font-weight:700;color:var(--navy);
  }
  .stat-card .lbl{
    font-family:'IBM Plex Mono', monospace;font-size:11px;color:var(--muted);
    text-transform:uppercase;letter-spacing:0.06em;margin-top:4px;
  }

  /* ---------- Chart ---------- */
  .chart-box{
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:20px 20px 10px;margin-bottom:28px;
  }
  .chart-box h3{font-family:'Fraunces', serif;font-size:15px;margin:0 0 16px;}
  #chart{display:flex;align-items:flex-end;gap:10px;height:120px;}
  .chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .chart-bar{
    width:100%;max-width:28px;background:linear-gradient(180deg, var(--gold), var(--red));
    border-radius:4px 4px 0 0;min-height:2px;
  }
  .chart-count{font-family:'IBM Plex Mono', monospace;font-size:11px;color:var(--muted);margin-top:4px;}
  .chart-label{font-size:11px;color:var(--muted);margin-top:2px;}

  /* ---------- Feed ---------- */
  .feed-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;}
  .feed-box h3{font-family:'Fraunces', serif;font-size:15px;margin:0 0 14px;}
  .feed-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
  .feed-item:last-child{border-bottom:none;}
  .feed-dot{width:8px;height:8px;border-radius:50%;background:var(--red);margin-top:6px;flex-shrink:0;}
  .feed-name{font-size:14px;font-weight:600;}
  .feed-email{font-weight:400;color:var(--muted);font-size:13px;}
  .feed-time{font-family:'IBM Plex Mono', monospace;font-size:11px;color:var(--muted);margin-top:2px;}
  .feed-empty{color:var(--muted);font-size:13px;}

  /* ---------- Visitor table ---------- */
  .filters{display:flex;gap:10px;margin:0 0 16px;flex-wrap:wrap;}
  .filters input{
    flex:1;min-width:150px;padding:10px 12px;
    border:1.5px solid var(--line);border-radius:8px;
    font-family:'Inter',sans-serif;font-size:14px;
  }
  .filters input:focus{outline:none;border-color:var(--red);}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
  #count{font-family:'IBM Plex Mono', monospace;font-size:12px;color:var(--muted);}
  #exportBtn, #refreshBtn{
    padding:9px 16px;
    background:var(--navy);color:var(--paper);border:none;
    border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
    font-family:'Inter',sans-serif;margin-left:8px;
  }
  #exportBtn:hover, #refreshBtn:hover{background:var(--navy-deep);}

  table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--line);}
  th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;}
  th{
    background:var(--navy);color:var(--paper);
    font-family:'IBM Plex Mono', monospace;font-size:11px;
    text-transform:uppercase;letter-spacing:0.06em;
  }
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:rgba(16,28,51,0.03);}

  #loading{font-family:'IBM Plex Mono', monospace;font-size:13px;color:var(--muted);margin:16px 0;}

  @media (max-width:700px){
    #appShell{flex-direction:column;}
    nav{width:100%;display:flex;align-items:center;gap:6px;padding:14px;overflow-x:auto;}
    nav .brand{display:none;}
    .nav-item{white-space:nowrap;margin-bottom:0;}
    main{padding:22px 16px;}
  }
</style>
</head>
<body>

<div id="login">
  <h2>Admin Login</h2>
  <input id="pw" type="password" placeholder="Password">
  <div id="pwErr">Incorrect password.</div>
  <button onclick="checkPw()">Enter</button>
</div>

<div id="appShell">
  <nav>
    <p class="brand">OINP Admin</p>
    <div class="nav-item active" id="nav-overview" onclick="showTab('overview')">Overview</div>
    <div class="nav-item" id="nav-visitors" onclick="showTab('visitors')">Visitor Log</div>
  </nav>

  <main>
    <div id="loading">Loading…</div>

    <!-- ===== OVERVIEW TAB ===== -->
    <div class="tab-panel" id="tab-overview">
      <h1>Overview</h1>
      <div class="stat-grid">
        <div class="stat-card"><div class="num" id="statTotal">0</div><div class="lbl">Total Visitors</div></div>
        <div class="stat-card"><div class="num" id="statToday">0</div><div class="lbl">Today</div></div>
        <div class="stat-card"><div class="num" id="statWeek">0</div><div class="lbl">Last 7 Days</div></div>
        <div class="stat-card"><div class="num" id="statMonth">0</div><div class="lbl">Last 30 Days</div></div>
        <div class="stat-card"><div class="num" id="statEmail">0</div><div class="lbl">Left Email</div></div>
      </div>

      <div class="chart-box">
        <h3>Last 7 days</h3>
        <div id="chart"></div>
      </div>

      <div class="feed-box">
        <h3>Recent Activity</h3>
        <div id="recentFeed"></div>
      </div>
    </div>

    <!-- ===== VISITOR LOG TAB ===== -->
    <div class="tab-panel" id="tab-visitors" style="display:none;">
      <h1>Visitor Log</h1>
      <div class="filters">
        <input id="fName" placeholder="Filter by first name">
        <input id="fEmail" placeholder="Filter by email">
      </div>
      <div class="toolbar">
        <div id="count"></div>
        <div>
          <button id="refreshBtn">Refresh</button>
          <button id="exportBtn">Export CSV</button>
        </div>
      </div>
      <table>
        <thead><tr><th>First Name</th><th>Email</th><th>Date / Time</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
</div>

</body>
</html>
